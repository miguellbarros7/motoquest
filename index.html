<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MotoQuest</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
        }

        .container {
            width: 90%;
            max-width: 500px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 35px 10px 20px;
        }

        h1 {
            color: #ff6a00;
            font-size: 42px;
            margin: 0;
        }

        .slogan {
            margin-top: 8px;
            color: #ddd;
        }

        .card {
            background: #1c1c1c;
            padding: 25px;
            border-radius: 16px;
            margin-top: 20px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 12px;
            border: none;
            border-radius: 8px;
            background: #ff6a00;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .secondary {
            background: #333;
        }

        .points {
            font-size: 32px;
            color: #ff6a00;
            font-weight: bold;
            text-align: center;
            margin: 15px 0;
        }

        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            min-height: 20px;
        }

        .challenge {
            border: 1px solid #333;
            border-radius: 12px;
            padding: 18px;
            margin-top: 15px;
        }

        .challenge h3 {
            margin-top: 0;
            color: #ff6a00;
        }

        #app {
            display: none;
        }

        footer {
            text-align: center;
            color: #777;
            padding: 30px 10px;
            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="container">

    <header>
        <h1>🏍️ MotoQuest</h1>
        <div class="slogan">
            Explora. Conquista. Desfruta.
        </div>
    </header>


    <!-- AUTENTICAÇÃO -->

    <section id="auth" class="card">

        <h2>Entrar no MotoQuest</h2>

        <input
            type="text"
            id="name"
            placeholder="Nome"
        >

        <input
            type="email"
            id="email"
            placeholder="Email"
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
        >

        <button id="registerButton">
            Criar conta
        </button>

        <button id="loginButton" class="secondary">
            Entrar
        </button>

        <div id="authMessage" class="message"></div>

    </section>


    <!-- APLICAÇÃO -->

    <section id="app">

        <div class="card">

            <h2>Olá, <span id="userName">Motard</span>! 👋</h2>

            <p style="text-align:center;">
                Os teus pontos
            </p>

            <div class="points">
                <span id="points">0</span> pontos
            </div>

        </div>


        <div class="card">

            <h2>🎯 Desafios</h2>

            <div class="challenge">

                <h3>📍 Miradouro da Boneca</h3>

                <p>
                    Visita o Miradouro da Boneca e valida a tua visita.
                </p>

                <p>
                    🏆 Recompensa: <strong>100 pontos</strong>
                </p>

                <button id="challengeButton">
                    📍 Validar visita
                </button>

            </div>

            <div id="challengeMessage" class="message"></div>

        </div>


        <div class="card">

            <button id="logoutButton" class="secondary">
                Sair
            </button>

        </div>

    </section>


    <footer>
        MotoQuest © 2026
    </footer>

</div>


<script>

    // ==========================================
    // CONFIGURAÇÃO SUPABASE
    // ==========================================

    const SUPABASE_URL =
        "https://gqimkzovrabptxqheedq.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_6PtfvoaY4V49YnCYifToyA_jQ1AXnPq";

    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    // ==========================================
    // ELEMENTOS DA PÁGINA
    // ==========================================

    const auth = document.getElementById("auth");
    const app = document.getElementById("app");

    const authMessage =
        document.getElementById("authMessage");

    const challengeMessage =
        document.getElementById("challengeMessage");


    // ==========================================
    // MENSAGENS
    // ==========================================

    function showMessage(element, text) {

        element.textContent = text;

    }


    // ==========================================
    // REGISTO
    // ==========================================

    async function register() {

        const name =
            document.getElementById("name").value.trim();

        const email =
            document.getElementById("email").value.trim();

        const password =
            document.getElementById("password").value;


        if (!name || !email || !password) {

            showMessage(
                authMessage,
                "Preenche nome, email e password."
            );

            return;
        }


        showMessage(
            authMessage,
            "A criar conta..."
        );


        const {
            data,
            error
        } = await supabaseClient.auth.signUp({

            email: email,

            password: password

        });


        if (error) {

            showMessage(
                authMessage,
                "Erro no registo: " + error.message
            );

            return;
        }


        if (!data.user) {

            showMessage(
                authMessage,
                "A conta foi criada. Verifica o teu email se for necessário."
            );

            return;
        }


        // Criar perfil

        const {
            error: profileError
        } = await supabaseClient
            .from("profiles")
            .upsert({

                id: data.user.id,

                name: name,

                points: 0

            });


        if (profileError) {

            showMessage(
                authMessage,
                "Conta criada, mas houve um erro no perfil: " +
                profileError.message
            );

            return;
        }


        showMessage(
            authMessage,
            "Conta criada com sucesso! 🎉"
        );


        await loadProfile(data.user);

    }


    // ==========================================
    // LOGIN
    // ==========================================

    async function login() {

        const email =
            document.getElementById("email").value.trim();

        const password =
            document.getElementById("password").value;


        if (!email || !password) {

            showMessage(
                authMessage,
                "Introduz o email e a password."
            );

            return;
        }


        showMessage(
            authMessage,
            "A entrar..."
        );


        const {
            data,
            error
        } = await supabaseClient.auth.signInWithPassword({

            email: email,

            password: password

        });


        if (error) {

            showMessage(
                authMessage,
                "Erro ao entrar: " + error.message
            );

            return;
        }


        if (!data.user) {

            showMessage(
                authMessage,
                "Não foi possível encontrar o utilizador."
            );

            return;
        }


        await loadProfile(data.user);

    }


    // ==========================================
    // CARREGAR PERFIL
    // ==========================================

    async function loadProfile(user) {

        showMessage(
            authMessage,
            "A carregar perfil..."
        );


        const {
            data: profiles,
            error
        } = await supabaseClient
            .from("profiles")
            .select("*")
            .eq("id", user.id)
            .limit(1);


        if (error) {

            showMessage(
                authMessage,
                "Erro ao carregar perfil: " +
                error.message
            );

            return;
        }


        if (!profiles || profiles.length === 0) {

            // Se o perfil ainda não existir,
            // tentamos criá-lo.

            const {
                error: createError
            } = await supabaseClient
                .from("profiles")
                .insert({

                    id: user.id,

                    name: user.email,

                    points: 0

                });


            if (createError) {

                showMessage(
                    authMessage,
                    "Perfil não encontrado: " +
                    createError.message
                );

                return;
            }


            // Tentar carregar novamente

            const {
                data: newProfiles,
                error: reloadError
            } = await supabaseClient
                .from("profiles")
                .select("*")
                .eq("id", user.id)
                .limit(1);


            if (reloadError) {

                showMessage(
                    authMessage,
                    "Erro ao carregar perfil: " +
                    reloadError.message
                );

                return;
            }


            if (!newProfiles || newProfiles.length === 0) {

                showMessage(
                    authMessage,
                    "Não foi possível criar o perfil."
                );

                return;
            }


            showApp(newProfiles[0]);

            return;
        }


        showApp(profiles[0]);

    }


    // ==========================================
    // MOSTRAR APLICAÇÃO
    // ==========================================

    function showApp(profile) {

        document.getElementById("userName").textContent =
            profile.name || "Motard";


        document.getElementById("points").textContent =
            profile.points || 0;


        auth.style.display = "none";

        app.style.display = "block";

    }


    // ==========================================
    // VALIDAR DESAFIO
    // ==========================================

    async function validateChallenge() {

        showMessage(
            challengeMessage,
            "A verificar localização..."
        );


        // Obter utilizador

        const {
            data: sessionData,
            error: sessionError
        } = await supabaseClient.auth.getSession();


        if (
            sessionError ||
            !sessionData.session ||
            !sessionData.session.user
        ) {

            showMessage(
                challengeMessage,
                "Tens de iniciar sessão primeiro."
            );

            return;
        }


        const user =
            sessionData.session.user;


        // Obter desafio

        const {
            data: challenges,
            error: challengeError
        } = await supabaseClient
            .from("challenges")
            .select("*")
            .eq("name", "Miradouro da Boneca")
            .limit(1);


        if (challengeError) {

            showMessage(
                challengeMessage,
                "Erro ao encontrar desafio: " +
                challengeError.message
            );

            return;
        }


        if (!challenges || challenges.length === 0) {

            showMessage(
                challengeMessage,
                "Desafio não encontrado."
            );

            return;
        }


        const challenge =
            challenges[0];


        // Verificar GPS

        if (!navigator.geolocation) {

            showMessage(
                challengeMessage,
                "O teu navegador não suporta GPS."
            );

            return;
        }


        navigator.geolocation.getCurrentPosition(

            async function(position) {

                const userLatitude =
                    position.coords.latitude;

                const userLongitude =
                    position.coords.longitude;


                const distance =
                    calculateDistance(

                        userLatitude,

                        userLongitude,

                        challenge.latitude,

                        challenge.longitude

                    );


                if (distance > challenge.radius) {

                    showMessage(

                        challengeMessage,

                        "❌ Ainda estás a " +
                        Math.round(distance) +
                        " metros do local."

                    );

                    return;
                }


                // Localização confirmada

                showMessage(

                    challengeMessage,

                    "📍 Localização confirmada! A atribuir pontos..."

                );


                // Obter perfil atual

                const {
                    data: profiles,
                    error: profileError
                } = await supabaseClient
                    .from("profiles")
                    .select("*")
                    .eq("id", user.id)
                    .limit(1);


                if (profileError) {

                    showMessage(

                        challengeMessage,

                        "Erro ao carregar pontos: " +
                        profileError.message

                    );

                    return;
                }


                if (!profiles || profiles.length === 0) {

                    showMessage(

                        challengeMessage,

                        "Perfil não encontrado."

                    );

                    return;
                }


                const profile =
                    profiles[0];


                const currentPoints =
                    Number(profile.points || 0);


                const newPoints =
                    currentPoints +
                    Number(challenge.points || 100);


                // Atualizar pontos

                const {
                    data: updatedProfiles,
                    error: updateError
                } = await supabaseClient
                    .from("profiles")
                    .update({

                        points: newPoints

                    })
                    .eq("id", user.id)
                    .select();


                if (updateError) {

                    showMessage(

                        challengeMessage,

                        "Erro ao atualizar pontos: " +
                        updateError.message

                    );

                    return;
                }


                document.getElementById("points").textContent =
                    newPoints;


                showMessage(

                    challengeMessage,

                    "🎉 Desafio concluído! Ganhaste " +
                    challenge.points +
                    " pontos."

                );

            },


            function(error) {

                if (error.code === 1) {

                    showMessage(

                        challengeMessage,

                        "❌ Tens de permitir o acesso à localização."

                    );

                } else {

                    showMessage(

                        challengeMessage,

                        "Erro ao obter localização: " +
                        error.message

                    );

                }

            },

            {
                enableHighAccuracy: true,

                timeout: 15000,

                maximumAge: 0

            }

        );

    }


    // ==========================================
    // CALCULAR DISTÂNCIA
    // ==========================================

    function calculateDistance(

        latitude1,

        longitude1,

        latitude2,

        longitude2

    ) {

        const earthRadius = 6371000;


        const lat1 =
            latitude1 * Math.PI / 180;

        const lat2 =
            latitude2 * Math.PI / 180;


        const deltaLatitude =
            (latitude2 - latitude1) *
            Math.PI / 180;


        const deltaLongitude =
            (longitude2 - longitude1) *
            Math.PI / 180;


        const a =

            Math.sin(deltaLatitude / 2) *
            Math.sin(deltaLatitude / 2)

            +

            Math.cos(lat1) *
            Math.cos(lat2) *
            Math.sin(deltaLongitude / 2) *
            Math.sin(deltaLongitude / 2);


        const c =

            2 *
            Math.atan2(
                Math.sqrt(a),
                Math.sqrt(1 - a)
            );


        return earthRadius * c;

    }


    // ==========================================
    // LOGOUT
    // ==========================================

    async function logout() {

        await supabaseClient.auth.signOut();


        app.style.display = "none";

        auth.style.display = "block";


        document.getElementById("password").value = "";


        showMessage(
            authMessage,
            "Sessão terminada."
        );

    }


    // ==========================================
    // BOTÕES
    // ==========================================

    document
        .getElementById("registerButton")
        .addEventListener(
            "click",
            register
        );


    document
        .getElementById("loginButton")
        .addEventListener(
            "click",
            login
        );


    document
        .getElementById("challengeButton")
        .addEventListener(
            "click",
            validateChallenge
        );


    document
        .getElementById("logoutButton")
        .addEventListener(
            "click",
            logout
        );


    // ==========================================
    // VERIFICAR SESSÃO AO ABRIR
    // ==========================================

    async function checkSession() {

        const {
            data,
            error
        } = await supabaseClient.auth.getSession();


        if (error) {

            console.error(
                "Erro ao verificar sessão:",
                error
            );

            return;
        }


        if (
            data.session &&
            data.session.user
        ) {

            await loadProfile(
                data.session.user
            );

        }

    }


    // Iniciar

    checkSession();

</script>

</body>
</html>
