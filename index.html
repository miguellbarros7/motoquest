<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MotoQuest</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
        }

        header {
            background: #ff6a00;
            text-align: center;
            padding: 25px;
        }

        header h1 {
            margin: 0;
            font-size: 32px;
        }

        main {
            max-width: 500px;
            margin: auto;
            padding: 20px;
        }

        section {
            background: #1d1d1d;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 15px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 14px;
            margin: 7px 0;
            border: 0;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            border: 0;
            border-radius: 8px;
            background: #ff6a00;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button.secondary {
            background: #333;
        }

        #app {
            display: none;
        }

        .points {
            font-size: 30px;
            color: #ff6a00;
            font-weight: bold;
        }

        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
        }

        .challenge {
            border: 1px solid #444;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
        }

        .small {
            color: #aaa;
        }
    </style>
</head>

<body>

<header>
    <h1>🏍️ MotoQuest</h1>
    <p>Explora. Conquista. Desfruta.</p>
</header>

<main>

    <!-- LOGIN / REGISTO -->

    <section id="auth">

        <h2>Entrar na MotoQuest</h2>

        <input
            id="email"
            type="email"
            placeholder="Email"
        >

        <input
            id="password"
            type="password"
            placeholder="Palavra-passe"
        >

        <input
            id="name"
            type="text"
            placeholder="Nome (para criar conta)"
        >

        <button id="registerButton">
            Criar conta
        </button>

        <button id="loginButton" class="secondary">
            Entrar
        </button>

        <div id="authMessage"></div>

    </section>


    <!-- APLICAÇÃO -->

    <section id="app">

        <h2>Olá, <span id="userName"></span> 👋</h2>

        <p>Os teus pontos:</p>

        <div class="points">
            ⭐ <span id="points">0</span>
        </div>


        <div class="challenge">

            <h2>📍 Miradouro da Boneca</h2>

            <p>
                Visita o Miradouro da Boneca
                e ganha <strong>100 pontos</strong>.
            </p>

            <p class="small">
                Tens de estar perto do local para validar a visita.
            </p>

            <button id="challengeButton">
                Validar visita
            </button>

            <div id="challengeMessage"></div>

        </div>


        <button id="logoutButton" class="secondary">
            Sair da conta
        </button>

    </section>

</main>


<script>

    // ==============================
    // SUPABASE
    // ==============================

    const SUPABASE_URL =
        "https://gqimkzovrabptxqheedq.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_6PtfvoaY4V49YnCYifToyA_jQ1AXnPq";


    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    let currentUser = null;


    // ==============================
    // ELEMENTOS
    // ==============================

    const auth =
        document.getElementById("auth");

    const app =
        document.getElementById("app");

    const emailInput =
        document.getElementById("email");

    const passwordInput =
        document.getElementById("password");

    const nameInput =
        document.getElementById("name");

    const authMessage =
        document.getElementById("authMessage");

    const challengeMessage =
        document.getElementById("challengeMessage");


    // ==============================
    // MENSAGEM
    // ==============================

    function message(element, text, success = false) {

        element.textContent = text;

        element.className = "message";

        if (success) {
            element.style.background = "#164d25";
        } else {
            element.style.background = "#4d1616";
        }
    }


    // ==============================
    // CRIAR CONTA
    // ==============================

    async function register() {

        const email =
            emailInput.value.trim();

        const password =
            passwordInput.value;

        const name =
            nameInput.value.trim();


        if (!email || !password || !name) {

            message(
                authMessage,
                "Preenche o nome, email e palavra-passe."
            );

            return;
        }


        if (password.length < 6) {

            message(
                authMessage,
                "A palavra-passe deve ter pelo menos 6 caracteres."
            );

            return;
        }


        message(
            authMessage,
            "A criar conta..."
        );


        const { data, error } =
            await supabaseClient.auth.signUp({

                email: email,

                password: password
            });


        if (error) {

            message(
                authMessage,
                error.message
            );

            return;
        }


        if (!data.user) {

            message(
                authMessage,
                "Não foi possível criar a conta."
            );

            return;
        }


        const { error: profileError } =
            await supabaseClient
                .from("profiles")
                .upsert({

                    id: data.user.id,

                    name: name,

                    points: 0

                });


        if (profileError) {

            message(
                authMessage,
                "Conta criada, mas houve um problema no perfil: "
                + profileError.message
            );

            return;
        }


        message(
            authMessage,
            "Conta criada com sucesso! Agora podes entrar.",
            true
        );
    }


    // ==============================
    // LOGIN
    // ==============================

    async function login() {

        const email =
            emailInput.value.trim();

        const password =
            passwordInput.value;


        if (!email || !password) {

            message(
                authMessage,
                "Introduz o email e a palavra-passe."
            );

            return;
        }


        message(
            authMessage,
            "A entrar..."
        );


        const { data, error } =
            await supabaseClient.auth.signInWithPassword({

                email: email,

                password: password

            });


        if (error) {

            message(
                authMessage,
                error.message
            );

            return;
        }


        currentUser =
            data.user;


        await loadProfile();
    }


    // ==============================
    // PERFIL
    // ==============================

    async function loadProfile() {

        if (!currentUser) {
            return;
        }


        const { data: profile, error } =
            await supabaseClient
                .from("profiles")
                .select("*")
                .eq("id", currentUser.id)
                .single();


        if (error) {

            message(
                authMessage,
                "Erro ao carregar o perfil: "
                + error.message
            );

            return;
        }


        document.getElementById("userName")
            .textContent = profile.name;


        document.getElementById("points")
            .textContent = profile.points || 0;


        auth.style.display = "none";

        app.style.display = "block";
    }


    // ==============================
    // VALIDAR DESAFIO
    // ==============================

    async function validateChallenge() {

        if (!currentUser) {

            message(
                challengeMessage,
                "Tens de entrar primeiro."
            );

            return;
        }


        message(
            challengeMessage,
            "A procurar a tua localização..."
        );


        const { data: challenges, error } =
            await supabaseClient
                .from("challenges")
                .select("*")
                .eq("name", "Miradouro da Boneca")
                .limit(1);


        if (error || !challenges.length) {

            message(
                challengeMessage,
                "Não foi possível encontrar o desafio."
            );

            return;
        }


        const challenge =
            challenges[0];


        if (!navigator.geolocation) {

            message(
                challengeMessage,
                "O teu navegador não suporta GPS."
            );

            return;
        }


        navigator.geolocation.getCurrentPosition(

            async function(position) {

                const lat =
                    position.coords.latitude;

                const lon =
                    position.coords.longitude;


                const distance =
                    calculateDistance(

                        lat,
                        lon,

                        challenge.latitude,
                        challenge.longitude
                    );


                const radius =
                    challenge.radius || 150;


                if (distance > radius) {

                    message(
                        challengeMessage,

                        "Estás a "
                        + Math.round(distance)
                        + " metros do local. "
                        + "Aproxima-te do Miradouro da Boneca."
                    );

                    return;
                }


                const { data: profile, error } =
                    await supabaseClient
                        .from("profiles")
                        .select("points")
                        .eq("id", currentUser.id)
                        .single();


                if (error) {

                    message(
                        challengeMessage,
                        "Erro ao carregar os pontos."
                    );

                    return;
                }


                const newPoints =
                    (profile.points || 0)
                    + (challenge.points || 100);


                const { error: updateError } =
                    await supabaseClient
                        .from("profiles")
                        .update({
                            points: newPoints
                        })
                        .eq("id", currentUser.id);


                if (updateError) {

                    message(
                        challengeMessage,
                        "Erro ao atualizar os pontos: "
                        + updateError.message
                    );

                    return;
                }


                document.getElementById("points")
                    .textContent = newPoints;


                message(
                    challengeMessage,
                    "🎉 Visita validada! Ganhaste "
                    + challenge.points
                    + " pontos!",
                    true
                );

            },


            function() {

                message(
                    challengeMessage,
                    "Permite o acesso à localização no navegador."
                );

            },

            {
                enableHighAccuracy: true,
                timeout: 10000,
                maximumAge: 0
            }
        );
    }


    // ==============================
    // DISTÂNCIA
    // ==============================

    function calculateDistance(
        lat1,
        lon1,
        lat2,
        lon2
    ) {

        const R = 6371000;


        const dLat =
            (lat2 - lat1) * Math.PI / 180;

        const dLon =
            (lon2 - lon1) * Math.PI / 180;


        const a =
            Math.sin(dLat / 2) *
            Math.sin(dLat / 2)

            +

            Math.cos(lat1 * Math.PI / 180) *
            Math.cos(lat2 * Math.PI / 180) *

            Math.sin(dLon / 2) *
            Math.sin(dLon / 2);


        const c =
            2 *
            Math.atan2(
                Math.sqrt(a),
                Math.sqrt(1 - a)
            );


        return R * c;
    }


    // ==============================
    // LOGOUT
    // ==============================

    async function logout() {

        await supabaseClient.auth.signOut();

        currentUser = null;

        app.style.display = "none";

        auth.style.display = "block";

        emailInput.value = "";

        passwordInput.value = "";

        nameInput.value = "";

        authMessage.textContent = "";
    }


    // ==============================
    // BOTÕES
    // ==============================

    document
        .getElementById("registerButton")
        .addEventListener(
            "click",
            register
        );


    document
        .getElementById("loginButton")
        .addEventListener(
            "click",
            login
        );


    document
        .getElementById("challengeButton")
        .addEventListener(
            "click",
            validateChallenge
        );


    document
        .getElementById("logoutButton")
        .addEventListener(
            "click",
            logout
        );


    // ==============================
    // VERIFICAR SESSÃO
    // ==============================

    async function checkSession() {

        const { data } =
            await supabaseClient.auth.getSession();


        if (data.session) {

            currentUser =
                data.session.user;

            await loadProfile();
        }
    }


    checkSession();

</script>

</body>
</html>
