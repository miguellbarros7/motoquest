<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MotoQuest</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            margin: auto;
        }

        h1 {
            color: #ff6600;
            text-align: center;
        }

        h2 {
            color: #ff6600;
        }

        .box {
            background: #222;
            padding: 20px;
            margin-top: 20px;
            border-radius: 12px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            box-sizing: border-box;
            border-radius: 8px;
            border: none;
        }

        button {
            background: #ff6600;
            color: white;
            border: none;
            padding: 12px 18px;
            margin: 6px 4px 6px 0;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #e65c00;
        }

        .reward {
            background: #333;
            padding: 15px;
            margin-top: 12px;
            border-radius: 10px;
        }

        .points {
            font-size: 28px;
            color: #ff6600;
            font-weight: bold;
        }

        #message {
            margin-top: 15px;
            padding: 10px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🏍️ MotoQuest</h1>

    <div class="box">
        <h2>Entrar / Registar</h2>

        <input id="name" type="text" placeholder="Nome">

        <input id="email" type="email" placeholder="Email">

        <input id="password" type="password" placeholder="Password">

        <button id="registerButton">Registar</button>
        <button id="loginButton">Entrar</button>

        <div id="message"></div>
    </div>


    <div class="box">
        <h2>👤 O meu perfil</h2>

        <p>Nome: <span id="profileName">-</span></p>

        <p>Pontos:</p>
        <div class="points" id="profilePoints">0</div>

        <button id="logoutButton">Sair</button>
    </div>


    <div class="box">
        <h2>🎯 Desafio</h2>

        <p>
            Visita o <strong>Miradouro da Boneca</strong> e valida a tua visita através do GPS.
        </p>

        <button id="challengeButton">
            📍 Validar visita
        </button>
    </div>


    <div class="box">
        <h2>🎁 Recompensas</h2>

        <div id="rewards">
            A carregar recompensas...
        </div>
    </div>

</div>


<script>

const SUPABASE_URL = "https://gqimkzovrabptxqheedq.supabase.co";

const SUPABASE_KEY = "sb_publishable_6PtfvoaY4V49YnCYifToyA_jQ1AXnPq";

const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


function showMessage(text) {
    document.getElementById("message").textContent = text;
}


async function register() {

    const name = document.getElementById("name").value;
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    if (!email || !password) {
        showMessage("Preenche o email e a password.");
        return;
    }

    const result = await supabaseClient.auth.signUp({
        email: email,
        password: password
    });

    if (result.error) {
        showMessage(result.error.message);
        return;
    }

    const user = result.data.user;

    if (!user) {
        showMessage("Utilizador criado. Faz login.");
        return;
    }

    const profileResult = await supabaseClient
        .from("profiles")
        .upsert({
            id: user.id,
            name: name,
            points: 0
        });

    if (profileResult.error) {
        showMessage("Conta criada, mas houve um problema no perfil.");
        console.log(profileResult.error);
        return;
    }

    showMessage("Conta criada com sucesso!");
    await loadProfile();
}


async function login() {

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    const result = await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
    });

    if (result.error) {
        showMessage(result.error.message);
        return;
    }

    showMessage("Login efetuado com sucesso!");

    await loadProfile();
}


async function loadProfile() {

    const sessionResult = await supabaseClient.auth.getSession();

    const session = sessionResult.data.session;

    if (!session) {
        return;
    }

    const user = session.user;

    const profileResult = await supabaseClient
        .from("profiles")
        .select("name, points")
        .eq("id", user.id)
        .single();

    if (profileResult.error) {
        console.log(profileResult.error);
        return;
    }

    document.getElementById("profileName").textContent =
        profileResult.data.name || user.email;

    document.getElementById("profilePoints").textContent =
        profileResult.data.points || 0;
}


function calculateDistance(lat1, lon1, lat2, lon2) {

    const earthRadius = 6371000;

    const lat1Rad = lat1 * Math.PI / 180;
    const lat2Rad = lat2 * Math.PI / 180;

    const deltaLat = (lat2 - lat1) * Math.PI / 180;
    const deltaLon = (lon2 - lon1) * Math.PI / 180;

    const a =
        Math.sin(deltaLat / 2) * Math.sin(deltaLat / 2) +
        Math.cos(lat1Rad) *
        Math.cos(lat2Rad) *
        Math.sin(deltaLon / 2) *
        Math.sin(deltaLon / 2);

    const c = 2 * Math.atan2(
        Math.sqrt(a),
        Math.sqrt(1 - a)
    );

    return earthRadius * c;
}


async function validateChallenge() {

    showMessage("A obter a tua localização...");

    if (!navigator.geolocation) {
        showMessage("O teu dispositivo não suporta GPS.");
        return;
    }

    navigator.geolocation.getCurrentPosition(

        async function(position) {

            const userLat = position.coords.latitude;
            const userLon = position.coords.longitude;

            const challengeResult = await supabaseClient
                .from("challenges")
                .select("*")
                .eq("name", "Miradouro da Boneca")
                .single();

            if (challengeResult.error) {
                showMessage("Erro ao encontrar o desafio.");
                console.log(challengeResult.error);
                return;
            }

            const challenge = challengeResult.data;

            const distance = calculateDistance(
                userLat,
                userLon,
                challenge.latitude,
                challenge.longitude
            );

            if (distance > challenge.radius) {

                showMessage(
                    "Estás a " +
                    Math.round(distance) +
                    " metros do local. Aproxima-te para validar."
                );

                return;
            }

            const sessionResult = await supabaseClient.auth.getSession();

            const session = sessionResult.data.session;

            if (!session) {
                showMessage("Tens de iniciar sessão primeiro.");
                return;
            }

            const user = session.user;

            const profileResult = await supabaseClient
                .from("profiles")
                .select("points")
                .eq("id", user.id)
                .single();

            if (profileResult.error) {
                showMessage("Erro ao encontrar o teu perfil.");
                return;
            }

            const currentPoints = profileResult.data.points || 0;

            const newPoints = currentPoints + challenge.points;

            const updateResult = await supabaseClient
                .from("profiles")
                .update({
                    points: newPoints
                })
                .eq("id", user.id);

            if (updateResult.error) {
                showMessage("Erro ao atualizar os pontos.");
                console.log(updateResult.error);
                return;
            }

            document.getElementById("profilePoints").textContent = newPoints;

            showMessage(
                "🎉 Visita validada! Ganhaste " +
                challenge.points +
                " pontos."
            );
        },

        function(error) {

            showMessage(
                "Não foi possível obter a localização. Permite o acesso ao GPS."
            );

            console.log(error);
        }
    );
}


async function loadRewards() {

    const rewardsDiv = document.getElementById("rewards");

    const result = await supabaseClient
        .from("rewards")
        .select("*")
        .order("points", {
            ascending: true
        });

    if (result.error) {

        rewardsDiv.textContent =
            "Erro ao carregar as recompensas.";

        console.log(result.error);

        return;
    }

    if (!result.data || result.data.length === 0) {

        rewardsDiv.textContent =
            "Ainda não existem recompensas.";

        return;
    }

    rewardsDiv.innerHTML = "";

    result.data.forEach(function(reward) {

        const rewardDiv = document.createElement("div");

        rewardDiv.className = "reward";

        rewardDiv.innerHTML =
            "<h3>🎁 " + reward.name + "</h3>" +
            "<p>" + (reward.description || "") + "</p>" +
            "<p><strong>" + reward.points + " pontos</strong></p>" +
            "<p>🏆 " + reward.reward + "</p>";

        rewardsDiv.appendChild(rewardDiv);

    });
}


async function logout() {

    await supabaseClient.auth.signOut();

    document.getElementById("profileName").textContent = "-";

    document.getElementById("profilePoints").textContent = "0";

    showMessage("Sessão terminada.");
}


async function checkSession() {

    const result = await supabaseClient.auth.getSession();

    if (result.data.session) {
        await loadProfile();
    }

    await loadRewards();
}


document
    .getElementById("registerButton")
    .addEventListener("click", register);


document
    .getElementById("loginButton")
    .addEventListener("click", login);


document
    .getElementById("challengeButton")
    .addEventListener("click", validateChallenge);


document
    .getElementById("logoutButton")
    .addEventListener("click", logout);


checkSession();

</script>

</body>
</html>
