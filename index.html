<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MotoQuest</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
        }

        header {
            background: #ff6a00;
            padding: 20px;
            text-align: center;
        }

        h1 {
            margin: 0;
        }

        main {
            max-width: 600px;
            margin: auto;
            padding: 20px;
        }

        section {
            background: #1d1d1d;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 15px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 14px;
            margin: 7px 0;
            border-radius: 8px;
            border: none;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 8px;
            border: none;
            border-radius: 8px;
            background: #ff6a00;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button.secondary {
            background: #333;
        }

        .points {
            font-size: 28px;
            color: #ff6a00;
            font-weight: bold;
        }

        .success {
            color: #4caf50;
            margin-top: 10px;
        }

        .error {
            color: #ff4444;
            margin-top: 10px;
        }

        #app {
            display: none;
        }

        #logout {
            margin-top: 15px;
        }

        .challenge {
            border: 1px solid #444;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
        }

        .small {
            color: #aaa;
            font-size: 14px;
        }
    </style>
</head>

<body>

<header>
    <h1>🏍️ MotoQuest</h1>
    <p>Explora. Conquista. Desfruta.</p>
</header>

<main>

    <!-- LOGIN / REGISTO -->
    <section id="auth">

        <h2>Entrar na MotoQuest</h2>

        <input
            type="email"
            id="email"
            placeholder="Email"
        >

        <input
            type="password"
            id="password"
            placeholder="Palavra-passe"
        >

        <input
            type="text"
            id="name"
            placeholder="Nome (apenas para criar conta)"
        >

        <button onclick="register()">
            Criar conta
        </button>

        <button class="secondary" onclick="login()">
            Entrar
        </button>

        <div id="authMessage"></div>

    </section>


    <!-- APLICAÇÃO -->
    <section id="app">

        <h2>Olá, <span id="userName"></span>! 👋</h2>

        <p>Os teus pontos:</p>

        <div class="points">
            ⭐ <span id="points">0</span>
        </div>

        <div class="challenge">

            <h2>📍 Miradouro da Boneca</h2>

            <p>
                Visita o Miradouro da Boneca e ganha
                <strong>100 pontos</strong>.
            </p>

            <p class="small">
                Tens de estar no local para validar a visita.
            </p>

            <button onclick="validateChallenge()">
                Validar visita
            </button>

            <div id="challengeMessage"></div>

        </div>

        <button id="logout" class="secondary" onclick="logout()">
            Sair da conta
        </button>

    </section>

</main>


<script>

    // =========================
    // SUPABASE
    // =========================

    const SUPABASE_URL =
        "https://gqimkzovrabptxqheedq.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_6PtfvoaY4V49YnCYifToyA_jQ1AXnPq";

    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    let currentUser = null;


    // =========================
    // MENSAGENS
    // =========================

    function showAuthMessage(message, type = "") {

        const element =
            document.getElementById("authMessage");

        element.textContent = message;

        element.className = type;
    }


    function showChallengeMessage(message, type = "") {

        const element =
            document.getElementById("challengeMessage");

        element.textContent = message;

        element.className = type;
    }


    // =========================
    // CRIAR CONTA
    // =========================

    async function register() {

        const email =
            document.getElementById("email").value.trim();

        const password =
            document.getElementById("password").value;

        const name =
            document.getElementById("name").value.trim();


        if (!email || !password || !name) {

            showAuthMessage(
                "Preenche o nome, email e palavra-passe.",
                "error"
            );

            return;
        }


        const { data, error } =
            await supabaseClient.auth.signUp({

                email: email,

                password: password
            });


        if (error) {

            showAuthMessage(
                error.message,
                "error"
            );

            return;
        }


        if (!data.user) {

            showAuthMessage(
                "Não foi possível criar a conta.",
                "error"
            );

            return;
        }


        // Criar perfil
        const { error: profileError } =
            await supabaseClient
                .from("profiles")
                .upsert({

                    id: data.user.id,

                    name: name,

                    points: 0

                });


        if (profileError) {

            showAuthMessage(
                "Conta criada, mas houve um problema ao criar o perfil: "
                + profileError.message,
                "error"
            );

            return;
        }


        showAuthMessage(
            "Conta criada com sucesso! 🎉",
            "success"
        );
    }


    // =========================
    // LOGIN
    // =========================

    async function login() {

        const email =
            document.getElementById("email").value.trim();

        const password =
            document.getElementById("password").value;


        if (!email || !password) {

            showAuthMessage(
                "Introduz o email e a palavra-passe.",
                "error"
            );

            return;
        }


        const { data, error } =
            await supabaseClient.auth.signInWithPassword({

                email: email,

                password: password
            });


        if (error) {

            showAuthMessage(
                error.message,
                "error"
            );

            return;
        }


        currentUser = data.user;

        await loadUser();
    }


    // =========================
    // CARREGAR UTILIZADOR
    // =========================

    async function loadUser() {

        if (!currentUser) return;


        let { data: profile, error } =
            await supabaseClient
                .from("profiles")
                .select("*")
                .eq("id", currentUser.id)
                .maybeSingle();


        // Se ainda não existir perfil, cria um
        if (!profile) {

            const name =
                document.getElementById("name").value.trim()
                || "Motociclista";


            const { data: newProfile, error: createError } =
                await supabaseClient
                    .from("profiles")
                    .insert({

                        id: currentUser.id,

                        name: name,

                        points: 0

                    })
                    .select()
                    .single();


            if (createError) {

                showAuthMessage(
                    "Erro ao criar o perfil: "
                    + createError.message,
                    "error"
                );

                return;
            }


            profile = newProfile;
        }


        document.getElementById("userName").textContent =
            profile.name;

        document.getElementById("points").textContent =
            profile.points || 0;


        document.getElementById("auth").style.display =
            "none";

        document.getElementById("app").style.display =
            "block";
    }


    // =========================
    // VALIDAR DESAFIO
    // =========================

    async function validateChallenge() {

        showChallengeMessage(
            "A verificar a tua localização...",
            ""
        );


        if (!currentUser) {

            showChallengeMessage(
                "Tens de entrar na tua conta primeiro.",
                "error"
            );

            return;
        }


        // Procurar o desafio na base de dados
        const { data: challenges, error } =
            await supabaseClient
                .from("challenges")
                .select("*")
                .eq("name", "Miradouro da Boneca")
                .limit(1);


        if (error || !challenges || !challenges.length) {

            showChallengeMessage(
                "Não foi possível encontrar o desafio.",
                "error"
            );

            return;
        }


        const challenge = challenges[0];


        if (!navigator.geolocation) {

            showChallengeMessage(
                "O teu navegador não suporta localização GPS.",
                "error"
            );

            return;
        }


        navigator.geolocation.getCurrentPosition(

            async function(position) {

                const userLat =
                    position.coords.latitude;

                const userLon =
                    position.coords.longitude;


                const distance =
                    calculateDistance(

                        userLat,
                        userLon,

                        challenge.latitude,
                        challenge.longitude
                    );


                const radius =
                    challenge.radius || 150;


                if (distance > radius) {

                    showChallengeMessage(

                        "Estás a cerca de "
                        + Math.round(distance)
                        + " metros do local. "
                        + "Aproxima-te do Miradouro da Boneca.",

                        "error"
                    );

                    return;
                }


                // Ler pontos atuais
                const { data: profile, error: profileError } =
                    await supabaseClient
                        .from("profiles")
                        .select("points")
                        .eq("id", currentUser.id)
                        .single();


                if (profileError) {

                    showChallengeMessage(
                        "Erro ao carregar os pontos.",
                        "error"
                    );

                    return;
                }


                const newPoints =
                    (profile.points || 0)
                    + challenge.points;


                const { error: updateError } =
                    await supabaseClient
                        .from("profiles")
                        .update({
                            points: newPoints
                        })
                        .eq("id", currentUser.id);


                if (updateError) {

                    showChallengeMessage(
                        "Erro ao adicionar pontos: "
                        + updateError.message,
                        "error"
                    );

                    return;
                }


                document.getElementById("points").textContent =
                    newPoints;


                showChallengeMessage(
                    "🎉 Visita validada! Ganhaste "
                    + challenge.points
                    + " pontos!",
                    "success"
                );

            },

            function(error) {

                showChallengeMessage(
                    "Não foi possível obter a tua localização. "
                    + "Permite o acesso à localização no navegador.",
                    "error"
                );

            },

            {
                enableHighAccuracy: true,

                timeout: 10000,

                maximumAge: 0
            }
        );
    }


    // =========================
    // DISTÂNCIA GPS
    // =========================

    function calculateDistance(
        lat1,
        lon1,
        lat2,
        lon2
    ) {

        const R = 6371000;

        const dLat =
            (lat2 - lat1) *
            Math.PI / 180;

        const dLon =
            (lon2 - lon1) *
            Math.PI / 180;


        const a =
            Math.sin(dLat / 2) *
            Math.sin(dLat / 2)

            +

            Math.cos(lat1 * Math.PI / 180) *
            Math.cos(lat2 * Math.PI / 180) *

            Math.sin(dLon / 2) *
            Math.sin(dLon / 2);


        const c =
            2 *
            Math.atan2(
                Math.sqrt(a),
                Math.sqrt(1 - a)
            );


        return R * c;
    }


    // =========================
    // LOGOUT
    // =========================

    async function logout() {

        await supabaseClient.auth.signOut();

        currentUser = null;

        document.getElementById("app").style.display =
            "none";

        document.getElementById("auth").style.display =
            "block";

        document.getElementById("authMessage").textContent =
            "";
    }


    // =========================
    // VERIFICAR SESSÃO
    // =========================

    async function checkSession() {

        const { data } =
            await supabaseClient.auth.getSession();


        if (data.session) {

            currentUser =
                data.session.user;

            await loadUser();
        }
    }


    checkSession();

</script>

</body>
</html>
