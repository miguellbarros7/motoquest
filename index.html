<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MotoQuesTT</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
        }

        header {
            text-align: center;
            padding: 25px 20px;
            border-bottom: 3px solid #ff6a00;
        }

        .logo {
            font-size: 32px;
            font-weight: bold;
        }

        .logo span {
            color: #ff6a00;
        }

        .tagline {
            color: #bbb;
            margin-top: 5px;
        }

        .points {
            display: inline-block;
            margin-top: 15px;
            background: #ff6a00;
            padding: 10px 18px;
            border-radius: 20px;
            font-weight: bold;
        }

        main {
            max-width: 600px;
            margin: auto;
            padding: 20px;
        }

        .card {
            background: #1d1d1d;
            border-radius: 18px;
            padding: 25px;
            margin-bottom: 20px;
        }

        h1, h2 {
            margin-top: 0;
        }

        input {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            border: none;
            border-radius: 8px;
            background: #292929;
            color: white;
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 10px;
            border: none;
            border-radius: 9px;
            background: #ff6a00;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #e85d00;
        }

        button.secondary {
            background: #333;
        }

        button:disabled {
            background: #555;
        }

        .challenge {
            background: #292929;
            padding: 20px;
            border-radius: 12px;
            margin-top: 15px;
        }

        .reward {
            color: #ff6a00;
            font-weight: bold;
            font-size: 20px;
        }

        #message {
            padding: 15px;
            margin-top: 15px;
            border-radius: 8px;
            display: none;
        }

        .success {
            display: block !important;
            background: #174d2a;
        }

        .error {
            display: block !important;
            background: #551c1c;
        }

        .info {
            display: block !important;
            background: #183c50;
        }

        .hidden {
            display: none;
        }

        .logout {
            background: #333;
        }

        footer {
            text-align: center;
            color: #777;
            padding: 30px;
        }
    </style>
</head>

<body>

<header>

    <div class="logo">
        MOTO<span>QUEST</span>
    </div>

    <div class="tagline">
        Explora. Conquista. Desfruta.
    </div>

    <div id="pointsBox" class="points hidden">
        ⭐ <span id="points">0</span> pontos
    </div>

</header>


<main>

    <!-- LOGIN / REGISTO -->

    <section id="authCard" class="card">

        <h1>🏍️ Bem-vindo à MotoQuest</h1>

        <p>
            Cria uma conta e começa a ganhar pontos
            enquanto descobres novos lugares.
        </p>

        <input
            type="email"
            id="email"
            placeholder="Email"
        >

        <input
            type="password"
            id="password"
            placeholder="Palavra-passe"
        >

        <input
            type="text"
            id="name"
            placeholder="Nome (apenas para registo)"
        >

        <button onclick="register()">
            Criar conta
        </button>

       <button class="secondary" onclick="login()">
    Entrar
</button>

        <div id="authMessage"></div>

    </section>


    <!-- ÁREA DO UTILIZADOR -->

    <section id="userCard" class="card hidden">

        <h2>Olá, <span id="userName"></span>! 👋</h2>

        <p>
            Continua a explorar para ganhar mais pontos.
        </p>

        <button class="logout" onclick="logout()">
            Terminar sessão
        </button>

    </section>


    <!-- DESAFIOS -->

    <section id="challengeCard" class="card hidden">

        <h2>🏆 Desafios</h2>

        <div id="challenges">
            A carregar desafios...
        </div>

    </section>


    <div id="message"></div>

</main>


<footer>
    MotoQuest © 2026<br>
    Cada passeio é uma nova descoberta.
</footer>


<script>

    /*
    =====================================
    CONFIGURAÇÃO SUPABASE
    =====================================
    */

    const SUPABASE_URL =
        "https://gqimkzovrabptxqheedq.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_6PtfvoaY4V49YnCYifToyA_jQ1AXnPq";


    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    let currentUser = null;


    /*
    =====================================
    REGISTAR UTILIZADOR
    =====================================
    */

    async function register() {

        const email =
            document.getElementById("email").value.trim();

        const password =
            document.getElementById("password").value;

        const name =
            document.getElementById("name").value.trim();


        if (!email || !password || !name) {

            showAuthMessage(
                "Preenche o nome, email e palavra-passe.",
                "error"
            );

            return;
        }


        const { data, error } =
            await supabaseClient.auth.signUp({

                email: email,

                password: password

            });


        if (error) {

            showAuthMessage(
                error.message,
                "error"
            );

            return;
        }


        /*
        Criar perfil.
        */

        if (data.user) {

            const { error: profileError } =
                await supabaseClient
                    .from("profiles")
                    .insert({

                        id: data.user.id,

                        name: name,

                        points: 0

                    });


            if (profileError) {

                console.error(profileError);

            }

        }


        showAuthMessage(
            "✅ Conta criada! Verifica o teu email se o Supabase pedir confirmação.",
            "success"
        );

    }


    /*
    =====================================
    LOGIN
    =====================================
    */
async function login() {

    alert("O botão Entrar está a funcionar!");

    const email =
        document.getElementById("email").value.trim();
    async function login() {

        const email =
            document.getElementById("email").value.trim();

        const password =
            document.getElementById("password").value;


        const { data, error } =
            await supabaseClient.auth.signInWithPassword({

                email: email,

                password: password

            });


        if (error) {

            showAuthMessage(
                error.message,
                "error"
            );

            return;
        }


        currentUser = data.user;

        await loadUser();

    }


    /*
    =====================================
    CARREGAR UTILIZADOR
    =====================================
    */

    async function loadUser() {

        if (!currentUser) return;


        const { data, error } =
            await supabaseClient
                .from("profiles")
                .select("*")
                .eq("id", currentUser.id)
                .single();


        if (error) {

            console.error(error);

            return;
        }


        document.getElementById("userName")
            .textContent = data.name || "Motociclista";


        document.getElementById("points")
            .textContent = data.points || 0;


        document.getElementById("authCard")
            .classList.add("hidden");


        document.getElementById("userCard")
            .classList.remove("hidden");


        document.getElementById("challengeCard")
            .classList.remove("hidden");


        document.getElementById("pointsBox")
            .classList.remove("hidden");


        loadChallenges();

    }


    /*
    =====================================
    CARREGAR DESAFIOS
    =====================================
    */

    async function loadChallenges() {

        const { data, error } =
            await supabaseClient
                .from("challenges")
                .select("*");


        if (error) {

            document.getElementById("challenges")
                .innerHTML =
                "❌ Não foi possível carregar os desafios.";

            console.error(error);

            return;
        }


        const container =
            document.getElementById("challenges");


        container.innerHTML = "";


        data.forEach(challenge => {

            const div =
                document.createElement("div");


            div.className = "challenge";


            div.innerHTML = `

                <h3>📍 ${challenge.name}</h3>

                <p>
                    ${challenge.description || ""}
                </p>

                <p class="reward">
                    ⭐ +${challenge.points} pontos
                </p>

                <button
                    onclick="validateVisit(${challenge.id})"
                >
                    📍 Validar visita
                </button>

            `;


            container.appendChild(div);

        });

    }


    /*
    =====================================
    VALIDAR VISITA
    =====================================
    */

    async function validateVisit(challengeId) {

        showMessage(
            "📡 A obter a tua localização...",
            "info"
        );


        if (!navigator.geolocation) {

            showMessage(
                "❌ O teu dispositivo não suporta GPS.",
                "error"
            );

            return;

        }


        const { data: challenge, error } =
            await supabaseClient
                .from("challenges")
                .select("*")
                .eq("id", challengeId)
                .single();


        if (error) {

            showMessage(
                "❌ Não foi possível carregar o desafio.",
                "error"
            );

            return;

        }


        navigator.geolocation.getCurrentPosition(

            async function(position) {

                const userLat =
                    position.coords.latitude;

                const userLon =
                    position.coords.longitude;


                const distance =
                    calculateDistance(

                        userLat,

                        userLon,

                        challenge.latitude,

                        challenge.longitude

                    );


                if (distance > challenge.radius) {

                    showMessage(

                        "❌ Visita não confirmada.<br><br>" +

                        "Estás aproximadamente a " +

                        Math.round(distance) +

                        " metros do local.<br><br>" +

                        "Aproxima-te do ponto turístico e tenta novamente.",

                        "error"

                    );

                    return;

                }


                /*
                =====================================
                ADICIONAR PONTOS
                =====================================
                */


                const { data: profile, error: profileError } =
                    await supabaseClient
                        .from("profiles")
                        .select("points")
                        .eq("id", currentUser.id)
                        .single();


                if (profileError) {

                    showMessage(
                        "❌ Não foi possível encontrar o teu perfil.",
                        "error"
                    );

                    return;

                }


                const newPoints =
                    (profile.points || 0) +
                    challenge.points;


                const { error: updateError } =
                    await supabaseClient
                        .from("profiles")
                        .update({

                            points: newPoints

                        })
                        .eq("id", currentUser.id);


                if (updateError) {

                    showMessage(
                        "❌ Não foi possível guardar os pontos.",
                        "error"
                    );

                    console.error(updateError);

                    return;

                }


                document.getElementById("points")
                    .textContent = newPoints;


                showMessage(

                    "🎉 <strong>Visita confirmada!</strong><br><br>" +

                    "📍 Distância: " +
                    Math.round(distance) +
                    " metros<br><br>" +

                    "⭐ Ganhaste <strong>+" +
                    challenge.points +
                    " pontos</strong>!<br><br>" +

                    "🏆 Total: <strong>" +
                    newPoints +
                    " pontos</strong>",

                    "success"

                );

            },


            function(error) {

                showMessage(

                    "❌ Não foi possível obter a localização. " +
                    "Verifica se autorizaste o GPS no navegador.",

                    "error"

                );

            },


            {

                enableHighAccuracy: true,

                timeout: 15000,

                maximumAge: 0

            }

        );

    }


    /*
    =====================================
    DISTÂNCIA GPS
    =====================================
    */

    function calculateDistance(
        lat1,
        lon1,
        lat2,
        lon2
    ) {

        const R = 6371000;

        const p1 =
            lat1 * Math.PI / 180;

        const p2 =
            lat2 * Math.PI / 180;

        const dp =
            (lat2 - lat1) *
            Math.PI / 180;

        const dl =
            (lon2 - lon1) *
            Math.PI / 180;


        const a =
            Math.sin(dp / 2) *
            Math.sin(dp / 2) +

            Math.cos(p1) *
            Math.cos(p2) *

            Math.sin(dl / 2) *
            Math.sin(dl / 2);


        const c =
            2 *
            Math.atan2(
                Math.sqrt(a),
                Math.sqrt(1 - a)
            );


        return R * c;

    }


    /*
    =====================================
    LOGOUT
    =====================================
    */

    async function logout() {

        await supabaseClient.auth.signOut();

        location.reload();

    }


    /*
    =====================================
    MENSAGENS
    =====================================
    */

    function showMessage(
        text,
        type
    ) {

        const element =
            document.getElementById("message");

        element.innerHTML = text;

        element.className = type;

    }


    function showAuthMessage(
        text,
        type
    ) {

        const element =
            document.getElementById("authMessage");

        element.innerHTML = text;

        element.className = type;

    }


    /*
    =====================================
    VERIFICAR SESSÃO AO ABRIR
    =====================================
    */

    async function checkSession() {

        const { data } =
            await supabaseClient.auth.getSession();


        if (data.session) {

            currentUser =
                data.session.user;

            await loadUser();

        }

    }


    checkSession();

</script>

</body>
</html>
